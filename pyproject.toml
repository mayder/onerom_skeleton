[project]
name = "onerom_skeleton"
version = "0.1.0"
description = "Public skeleton for Onerom bots generated by humans or the AI Builder Runner"
readme = "README.md"
authors = [
    { name = "Onerom" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "onerom-core>=0.2.5",
]
keywords = [
    "onerom",
    "automation",
    "bot",
    "runner",
    "ai-builder-runner",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/mayder/onerom_skeleton"
Repository = "https://github.com/mayder/onerom_skeleton"
Documentation = "https://github.com/mayder/onerom_skeleton#readme"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.7",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "__init__.py",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
